<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You for Supporting EASJ INC</title>
  <meta name="description" content="Thank you for supporting EASJ INC." />
  <style>
    :root { --navy: #0a2342; --green: #005a3c; --gold: #c5962b; --blue: #0c7bd9; --white: #fff; --soft: #f4f8fb; --text: #17202a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #edf7ff, #f3f7f5); color: var(--text); min-height: 100vh; display: grid; place-items: center; }
    .card { background: var(--white); width: min(760px, calc(100% - 26px)); border-radius: 22px; box-shadow: 0 25px 60px rgba(10,35,66,0.08); padding: 36px 28px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 4vw, 2.8rem); color: var(--navy); }
    p { color: var(--text); font-size: 1.05rem; }
    .button { display: inline-block; margin-top: 18px; background: var(--gold); color: var(--navy); padding: 14px 22px; border-radius: 12px; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Thank you for your support.</h1>
    <p>Your message or support request has been received successfully.</p>
    <p>We will review your request and contact you as soon as possible.</p>
    <p>Thank you for standing with EASJ INC in the work of justice, fairness, accountability, and community empowerment.</p>
    <a class="button" href="index.html">Return home</a>
  </main>
</body>
</html>
